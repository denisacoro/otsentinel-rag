[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otsentinel-rag"
version = "0.1.0"
description = "Multilingual RAG and fine-tuned LLM platform for CPS, SCADA and Industrial IoT security."
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "transformers>=4.48,<6",
    "sentencepiece>=0.2",
    "numpy>=1.26,<3",
    "sentence-transformers>=5.6,<6",
    "qdrant-client>=1.18,<2",
    "mlflow>=2.19,<3",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "tests*",
    "data*",
    "docker*",
    "docs*",
    "finetuning*",
    "notebooks*",
    "scripts*",
    "ui*"
]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]